<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster Pal · Scan tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Poster Pal scan tracker</h1>
    </div>
    <nav id="campus-tabs" class="tabs" aria-label="Campus"></nav>
    <div class="controls">
      <a class="link" href="https://cg-5228.github.io/poster-pal/" target="_blank" rel="noopener" style="align-self:center">Order site</a>
      <label class="filter">
        <span class="sr-only">Customer</span>
        <select id="customer-filter">
          <option value="">All customers</option>
        </select>
      </label>
      <button id="add-btn" class="btn primary" type="button">+ Add poster</button>
    </div>
  </header>

  <main class="layout">
    <div class="map-wrap">
      <div id="map" aria-label="Map of DCU with poster locations"></div>
      <div id="add-hint" class="hint" hidden>
        Click the map where the poster is.
        <button type="button" id="cancel-add" class="link">Cancel</button>
      </div>
    </div>
    <aside id="panel" class="panel" aria-live="polite"></aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/posterpal-config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
